project:
  type: book
  output-dir: _book

book:
  title: "Biostatistics with R"
  subtitle: "A Practical Guide for Public Health Researchers"
  author:
    - name: "Bikram Adhikari"
      email: "bdhikari@memphis.edu"
      affiliation: "University of Memphis"
      orcid: "0000-0002-4299-9233"
  date: today
  date-format: "MMMM D, YYYY"

  cover-image: cover.png
  favicon: cover.png
  search: true
  repo-url: "https://github.com/Adrisyaone/epidemiologyR.git"
  repo-actions: [edit, issue]
  sharing: [twitter, linkedin]
  downloads: [pdf, epub]
  page-navigation: true
  back-to-top-navigation: true

  sidebar:
    style: "docked"
    search: true
    background: light
    logo: cover.png

  chapters:
    - index.qmd

    - part: "Introduction to R"
      chapters:
        - section1/Chapter1/01_introductions.qmd
        - section1/Chapter2/02_basics.qmd
        - section1/Chapter3/03_basics.qmd
        - section1/chapter4/04_data_types.qmd
        - section1/chapter5/04_descriptives.qmd
        - section1/chapter6/04_graphics.qmd


    - part: "Biostatistics"
      chapters: 
        - Section2/01_introduction_descriptive_statistics.qmd
        - Section2/02_measures_central_tendency.qmd
        - Section2/03_measures_of_dispersion.qmd
        - Section2/04_probability.qmd
        - Section2/05_discrete_probability_distributions.qmd
        - Section2/06_continuous_probability_distributions.qmd
        - Section2/07_intro_hypothesis_testing.qmd
        - Section2/05_bivariate.qmd
        - Section2/Numerical data analysis/06_linear_regression.qmd
        - Section2/Categorical data analysis/Categorical_data_analysis2.qmd
        - Section2/Count data analysis/Poisson's regression.qmd
        - Section2/Survival analysis/Survival_analysis.qmd
        - Section2/Sample size calculation/Sample size calculation.qmd

    
  appendices:
    - index.qmd

bibliography: references.bib
citation: true

execute:
  echo: true
  warning: false
  message: false
  cache: true
  freeze: auto

knitr:
  opts_chunk:
    comment: "#>"
    fig.align: "center"
    out.width: "85%"
    dpi: 300

format:
  html:
    theme:
      light: [cosmo, brand]
      dark:  [darkly, brand]
    mainfont: "Source Sans Pro"
    monofont: "Fira Code"
    fontsize: 1.1em
    linestretch: 1.7
    code-fold: false
    code-tools: false
    code-link: false
    code-overflow: scroll
    highlight-style: github
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    number-sections: false
    number-depth: 3
    smooth-scroll: true
    callout-appearance: simple
    fig-cap-location: bottom
    tbl-cap-location: top
    output-dir: _book

  pdf:
    documentclass: scrreprt
    classoption: [oneside, open=any]
    mainfont: "Times New Roman"
    sansfont: "Arial"
    monofont: "Courier New"
    fontsize: 12pt
    linestretch: 1.5
    title-page: true
    geometry:
      - top=30mm
      - bottom=30mm
      - left=25mm
      - right=25mm
    toc: true
    toc-depth: 3
    lof: true
    lot: true
    number-sections: true
    code-block-border-left: "#E83E8C"
    highlight-style: tango
    code-overflow: wrap
    colorlinks: true
    linkcolor: "NavyBlue"
    urlcolor: "NavyBlue"
    citecolor: "NavyBlue"
    cover-image: cover.png
    output-dir: _book

  epub:
    cover-image: cover.png
    toc: true
    output-dir: _book